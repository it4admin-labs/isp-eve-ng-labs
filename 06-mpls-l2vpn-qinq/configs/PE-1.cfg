#
sysname PE-1
#
set neid ba322d
#
vsm on-board-mode enable
#
snmp-agent trap type base-trap
#
undo dhcp enable
#
icmp rate-limit disable
#
router id 198.18.0.11
#
ip vpn-instance MNG-SW
 ipv4-family
  route-distinguisher 198.18.0.11:4090
  apply-label per-instance
  vpn-target 65001:4090 export-extcommunity
  vpn-target 65001:4090 import-extcommunity
#
mpls lsr-id 198.18.0.11
#
mpls
#
mpls l2vpn
#
pw-template NAT-1  
 mtu 2000
#
mpls ldp
 lsr-id 198.18.0.11
 #
 ipv4-family
  lsp-trigger host
#
mpls ldp remote-peer 198.18.0.5
#
mpls ldp remote-peer NAT-1
 remote-ip 198.18.0.5
#
aaa
 #              
 authentication-scheme default0
 #
 authentication-scheme default1
 #
 authentication-scheme default
  authentication-mode local radius
 #
 authorization-scheme default
 #
 accounting-scheme default0
 #
 accounting-scheme default1
 #
 domain default0
 #
 domain default1
 #
 domain default_admin
#
license
#
interface Eth-Trunk0
 ip address 198.18.1.15 255.255.255.254
 ospf cost 10000
 ospf network-type p2p
 ospf enable 1 area 0.0.0.0
 mode lacp-static
 mpls
 mpls ldp
#
interface Eth-Trunk1
 ip address 198.18.1.17 255.255.255.254
 ospf cost 10000
 ospf network-type p2p
 ospf enable 1 area 0.0.0.0
 mode lacp-static
 mpls
 mpls ldp
#
interface Eth-Trunk10
 mode lacp-static
#
interface Eth-Trunk10.3201 mode l2
 encapsulation dot1q vid 2000
 rewrite push vid 3201
 mpls l2vc 198.18.0.5 pw-template NAT-1 3201
#
interface Eth-Trunk10.4090
 vlan-type dot1q 4090
 ip binding vpn-instance MNG-SW
 ip address 172.16.11.1 255.255.255.0
#
interface Ethernet1/0/0
 undo shutdown
 eth-trunk 0
 undo dcn
 undo dcn mode vlan
#
interface Ethernet1/0/1
 undo shutdown
 eth-trunk 1
 undo dcn
 undo dcn mode vlan
#
interface Ethernet1/0/2
 undo shutdown
 undo dcn mode vlan
#
interface Ethernet1/0/3
 undo shutdown
 undo dcn mode vlan
#
interface Ethernet1/0/4
 undo shutdown
 undo dcn mode vlan
#
interface Ethernet1/0/5
 undo shutdown
 undo dcn mode vlan
#
interface Ethernet1/0/6
 undo shutdown
 undo dcn mode vlan
#
interface Ethernet1/0/7
 undo shutdown
 undo dcn mode vlan
#
interface Ethernet1/0/8
 undo shutdown
 undo dcn mode vlan
#               
interface Ethernet1/0/9
 undo shutdown
 eth-trunk 10
 undo dcn mode vlan
#
interface GigabitEthernet0/0/0
 undo shutdown
#
interface LoopBack0
 ip address 198.18.0.11 255.255.255.255
 ospf enable 1 area 0.0.0.0
#
interface NULL0
#
bgp 65001
 router-id 198.18.0.11
 group VRR internal
 peer VRR connect-interface LoopBack0
 peer 198.18.0.254 as-number 65001
 peer 198.18.0.254 group VRR
 peer 198.18.0.255 as-number 65001
 peer 198.18.0.255 group VRR
 #              
 ipv4-family unicast
  undo synchronization
  preference 170 170 170
  peer VRR enable
  peer 198.18.0.254 enable
  peer 198.18.0.254 group VRR
  peer 198.18.0.255 enable
  peer 198.18.0.255 group VRR
 #
 ipv4-family vpnv4
  policy vpn-target
  peer VRR enable
  peer 198.18.0.254 enable
  peer 198.18.0.254 group VRR
  peer 198.18.0.255 enable
  peer 198.18.0.255 group VRR
 #
 ipv4-family vpn-instance MNG-SW
  import-route direct
#
ospf 1 router-id 198.18.0.11
 area 0.0.0.0
#               
undo dcn
#
lldp enable
#
ssh authorization-type default aaa
#
ssh server cipher aes256_gcm aes128_gcm aes256_ctr aes192_ctr aes128_ctr aes256_cbc aes128_cbc 3des_cbc
#
ssh server dh-exchange min-len 1024
#
ssh client cipher aes256_gcm aes128_gcm aes256_ctr aes192_ctr aes128_ctr aes256_cbc aes128_cbc 3des_cbc
#
user-interface con 0
#
user-interface aux 0
#
local-aaa-server
#
vm-manager
#
return
